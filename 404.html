<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if (path.indexOf('plastic-core-boxes') !== -1) {
        window.location.replace('plastic-core-boxes' + search + hash);
      } else if (path.indexOf('gi-core-boxes') !== -1 || path.indexOf('core-boxes') !== -1) {
        window.location.replace('gi-core-boxes' + search + hash);
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
